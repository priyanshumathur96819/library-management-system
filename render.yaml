services:
  - type: web
    name: library-management-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Library Admin
      - key: ADMIN_EMAIL
        value: admin@library.demo
      - key: ADMIN_PASSWORD
        sync: false
